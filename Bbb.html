<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Modes - Ultimate XO</title>
    <style>
        #global-loader {
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #0d0015 0%, #05060a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100000; overflow: hidden;
        }
        .loader-grid-bg {
            position: absolute; inset: 0;
            display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
            opacity: 0.04; pointer-events: none;
        }
        .loader-grid-bg span { display:flex; align-items:center; justify-content:center; font-size: 5rem; font-weight: 900; color: #bc13fe; }
        .loader-xo-wrap { display: flex; gap: 20px; margin-bottom: 35px; align-items: center; }
        .loader-letter { font-size: 4rem; font-weight: 900; opacity: 0; animation: letterPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        .loader-letter.X { color: #fff; text-shadow: 0 0 30px #fff, 0 0 60px rgba(255,255,255,0.5); animation-delay: 0.1s; }
        .loader-letter.vs { color: rgba(255,255,255,0.2); font-size: 1.5rem; animation-delay: 0.2s; }
        .loader-letter.O { color: #9d00ff; text-shadow: 0 0 30px #9d00ff, 0 0 60px rgba(157,0,255,0.5); animation-delay: 0.3s; }
        @keyframes letterPop { from{opacity:0;transform:scale(0) rotate(-15deg)} to{opacity:1;transform:scale(1) rotate(0deg)} }
        .loader-box { text-align: center; width: 280px; position: relative; z-index: 1; }
        .loader-title { color: rgba(255,255,255,0.4); font-size: 0.75rem; font-weight: 700; letter-spacing: 6px; margin-bottom: 15px; text-transform: uppercase; }
        .bar-container { width: 100%; height: 3px; background: rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; position: relative; }
        #fill-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #9d00ff, #00f3ff, #ff0055); transition: width 0.2s ease; border-radius:20px; }
        .loader-percent { color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 12px; font-family: monospace; font-weight: bold; letter-spacing: 3px; }

        body {
            margin: 0; padding: 0; 
            background-color: #020205;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; box-sizing: border-box;
            position: relative;
        }

        .stars-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at center, #0a0a2e 0%, #020205 100%);
        }

        .game-title {
            color: #ffffff; font-size: 25px; font-weight: 900; text-transform: uppercase;
            text-align: center; letter-spacing: 2px; margin-bottom: 30px; z-index: 10;
            text-shadow: 0 0 10px #9d00ff, 0 0 20px #9d00ff;
        }

        .menu-container { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; width: 100%; }

        .mode-btn {
            width: 320px; padding: 12px 14px; font-size: 20px; font-weight: bold;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid; border-radius: 60px; 
            cursor: pointer; transition: 0.3s all ease-in-out; color: white;
            text-transform: uppercase; display: flex; flex-direction: column; align-items: center;
            position: relative; backdrop-filter: blur(3px);
        }

        .white-neon { border-color: #ffffff; color: #ffffff; } .white-neon:hover { background: white; color: black; box-shadow: 0 0 30px #ffffff; transform: scale(1.05); }
        .purple-neon { border-color: #9d00ff; color: #9d00ff; } .purple-neon:hover { background: #9d00ff; color: white; box-shadow: 0 0 30px #9d00ff; transform: scale(1.05); }
        .mystery-neon { border-color: #ffcc00; color: #ffcc00; } .mystery-neon:hover { background: #ffcc00; color: black; box-shadow: 0 0 30px #ffcc00; transform: scale(1.05); }
        .nomad-neon { border-color: #00f3ff; color: #00f3ff; } .nomad-neon:hover { background: #00f3ff; color: black; box-shadow: 0 0 30px #00f3ff; transform: scale(1.05); }
        .league-neon { border-color: #00ff66; color: #00ff66; } .league-neon:hover { background: #00ff66; color: black; box-shadow: 0 0 30px #00ff66; transform: scale(1.05); }
        .friend-neon { border-color: #ff0055; color: #ff0055; } .friend-neon:hover { background: #ff0055; color: #fff; box-shadow: 0 0 50px #ff0055; transform: scale(1.08); }

        .btn-subtext { display: block; font-size: 10px; margin-top: 2px; font-weight: normal; opacity: 0.8; color: inherit; }
    </style>
</head>
<body>

    <div class="stars-wrapper"></div>

    <div id="global-loader">
        <div class="loader-grid-bg">
            <span>X</span><span>O</span><span>X</span>
            <span>O</span><span>X</span><span>O</span><span>X</span><span>O</span><span>X</span>
        </div>
        <div class="loader-xo-wrap">
            <span class="loader-letter X">X</span>
            <span class="loader-letter vs">VS</span>
            <span class="loader-letter O">O</span>
        </div>
        <div class="loader-box">
            <div class="loader-title">LOADING MATCH</div>
            <div class="bar-container"><div id="fill-bar"></div></div>
            <div class="loader-percent" id="percent-txt">0%</div>
        </div>
    </div>

    <h1 class="game-title">CHOOSE YOUR BATTLE</h1>

    <div class="menu-container">
        <button class="mode-btn white-neon" onclick="goToPage('Tt.html')">
            LOCAL PVP
            <span class="btn-subtext">Classic 1v1 Battle</span>
        </button>

        <button class="mode-btn purple-neon" onclick="goToPage('Levels.html')">
            VS AI
            <span class="btn-subtext">Beat the machine</span>
        </button>

        <!-- زرار XO LEAGUE -->
        <button class="mode-btn league-neon" onclick="goToPage('OnAi.html')">
            XO LEAGUE
            <span class="btn-subtext">Ranked & Divisions</span>
        </button>

        <button class="mode-btn mystery-neon" onclick="goToPage('mystery.html')">
            MYSTERY MODE
            <span class="btn-subtext">Chaos & Power-ups</span>
        </button>

        <button class="mode-btn nomad-neon" onclick="goToPage('Tot.html')">
            NOMAD MODE
            <span class="btn-subtext">3 Marks - Pick & Move</span>
        </button>

        <button class="mode-btn friend-neon" onclick="goToPage('Online.html')">
            FRIEND MATCH
            <span class="btn-subtext">Online Multiplayer</span>
        </button>
    </div>

    <script src="auth.js"></script>
    <script>if (window.XOAuth) XOAuth.init({require:true, bar:true, pull:true}); else location.replace('Login.html');</script>
    <script>
        function goToPage(url) {
            const loader = document.getElementById('global-loader');
            const bar = document.getElementById('fill-bar');
            const txt = document.getElementById('percent-txt');
            if (loader.dataset.busy) return;          // نمنع الضغط المتكرر
            loader.dataset.busy = '1';
            loader.style.display = 'flex';
            const total = 3000, t0 = Date.now();      // نفس مدة تحميل dev
            const iv = setInterval(() => {
                const p = Math.min(100, Math.round((Date.now() - t0) / total * 100));
                bar.style.width = p + '%'; txt.innerText = p + '%';
                if (p >= 100) {
                    clearInterval(iv);
                    setTimeout(() => { window.location.href = url; }, 250);
                }
            }, 60);
        }

    </script>
</body>
</html>
